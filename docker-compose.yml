services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: studyforge
      POSTGRES_USER: studyforge
      POSTGRES_PASSWORD: studyforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma_server:
    image: chromadb/chroma:0.5.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@postgres:5432/studyforge
    volumes:
      - ./apps/api:/app

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma_server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@postgres:5432/studyforge
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT: http://minio:9000
      S3_AUTO_CREATE_BUCKET: "true"
      CHROMA_HOST: chroma_server
      CHROMA_PORT: "8000"
    volumes:
      - ./apps/api:/app

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q files,notifications,slides --concurrency=1 --max-tasks-per-child=5 --pool=solo
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma_server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@postgres:5432/studyforge
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT: http://minio:9000
      S3_AUTO_CREATE_BUCKET: "true"
      CHROMA_HOST: chroma_server
      CHROMA_PORT: "8000"
    volumes:
      - ./apps/api:/app

  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@postgres:5432/studyforge
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT: http://minio:9000
      CHROMA_HOST: chroma_server
      CHROMA_PORT: "8000"
    volumes:
      - ./apps/api:/app

  celery_analytics:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q analytics --concurrency=1 --max-tasks-per-child=5 --pool=solo
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyforge:studyforge@postgres:5432/studyforge
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT: http://minio:9000
      CHROMA_HOST: chroma_server
      CHROMA_PORT: "8000"
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    command: npx next dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
